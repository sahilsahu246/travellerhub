server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: any path that isn't a real file falls back to index.html
    # so client-side routes (e.g. /signin, /admin) don't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache the hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
