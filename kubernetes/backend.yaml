# Backend API. Env keys match backend/.env.sample exactly.
# Non-secret config -> ConfigMap; secrets (JWT + Google OAuth) -> Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: wanderlust
data:
  PORT: "8080"
  MONGODB_URI: "mongodb://mongodb:27017/wanderlust"
  REDIS_URL: "redis://redis:6379"
  NODE_ENV: "production"
  FRONTEND_URL: "http://65.0.185.152:31000"
  BACKEND_URL: "http://65.0.185.152:31100"
  ACCESS_COOKIE_MAXAGE: "120000"
  ACCESS_TOKEN_EXPIRES_IN: "120s"
  REFRESH_COOKIE_MAXAGE: "120000"
  REFRESH_TOKEN_EXPIRES_IN: "120s"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: wanderlust
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-long-random-string"
  GOOGLE_CLIENT_ID: "your_actual_google_client_id_here"
  GOOGLE_CLIENT_SECRET: "your_actual_google_client_secret_here"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wanderlust
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: dockerhub-creds
      containers:
        - name: backend
          image: sahilsahu6246/wanderlust-backend:11
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wanderlust
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31100
  type: NodePort